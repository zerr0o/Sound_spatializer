[package]
name = "sound-spatializer-desktop"
version = "0.2.0"
description = "Interface desktop de Sound Spatializer"
authors = ["Sound Spatializer contributors"]
edition = "2021"

[lib]
name = "sound_spatializer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The Tauri CLI enables this feature for production builds. It switches the
# WebView from build.devUrl to the frontend assets embedded from frontendDist.
# Keep it explicit so a production build cannot silently behave like `tauri dev`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Devices_Properties",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Performance",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell_PropertiesSystem"
] }

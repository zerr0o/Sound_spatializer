name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and test desktop UI
        run: |
          pnpm --dir apps/desktop check
          pnpm --dir apps/desktop test

      - name: Check Tauri host
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'apps/desktop/src-tauri/Cargo.toml') {
            cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
            cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
            cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
            cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          }

      - name: Configure native engine
        run: cmake -S native/engine -B build/engine-mysofa -DBUILD_TESTING=ON -DSOUND_SPATIALIZER_ENABLE_MYSOFA=OFF

      - name: Build native engine
        run: cmake --build build/engine-mysofa --config Release --parallel

      - name: Test native engine
        run: ctest --test-dir build/engine-mysofa -C Release --output-on-failure

      - name: Restore verified HRTF cache
        uses: actions/cache@v4
        with:
          path: resources/hrtf/data
          key: hrtf-sadie-sofa-${{ hashFiles('resources/hrtf/profiles.json') }}

      - name: Fetch verified HRTF resources
        shell: pwsh
        run: .\tools\fetch-hrtf.ps1

      - name: Build and verify production Tauri host
        run: pnpm build:ui

      - name: Test virtual-driver render history
        shell: pwsh
        run: .\native\driver\scripts\Test-DriverTransport.ps1 -Configuration Release

      - name: Build driver lifecycle helper
        shell: pwsh
        run: .\native\driver\scripts\Build-DriverTools.ps1 -Configuration Release

      - name: Test repository tools
        run: |
          python -m unittest discover -s tools/tests -v
          pnpm test:contracts
